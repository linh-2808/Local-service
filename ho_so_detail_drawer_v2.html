let cur=0;
let confAction=null;

function renderList(){
  const el=document.getElementById('lp-items');
  el.innerHTML=RECORDS.map((r,i)=>{
    const sm=STATUS_META[r.status];
    const sl=SLA_META[r.sla];
    return`<div class="lp-item ${i===cur?'active':''}" data-idx="${i}">
      <div class="lp-name">${r.name}</div>
      <div class="lp-sub">${r.type} · ${r.slaH}h</div>
      <div class="lp-badges"><span class="pill ${sm.cls}">${sm.label}</span><span class="pill ${sl.cls}">${sl.label}</span></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.lp-item').forEach(el=>el.addEventListener('click',function(){
    cur=+this.dataset.idx;
    renderAll();
  }));
}

    {ok:r.risk.email,icon_ok:'ti-circle-check',icon_err:'ti-circle-x',ok_cls:'risk-ok',err_cls:'risk-err',ok_txt:'risk-text-ok',err_txt:'risk-text-err',ok_icon:'risk-icon-ok',err_icon:'risk-icon-err',label:r.risk.email?'Email đã xác minh':'Email chưa xác minh'},

function renderAll(){
  renderList();
  renderDetail();
}

let confType=null;
function openConf(type){
  confType=type;
  const wrap=document.getElementById('conf-wrap');
  const icon=document.getElementById('conf-icon');
  const iconI=document.getElementById('conf-icon-i');
  const title=document.getElementById('conf-title');
  const sub=document.getElementById('conf-sub');
  const commentWrap=document.getElementById('conf-comment-wrap');
  const confirmBtn=document.getElementById('conf-confirm');
  if(type==='approve'){
    icon.className='conf-icon conf-icon-approve';
    iconI.className='ti ti-check';
    title.textContent='Xác nhận duyệt hồ sơ?';
    sub.textContent='Hành động này sẽ chuyển trạng thái sang Approved và thông báo đến đối tác.';
    commentWrap.style.display='none';
    confirmBtn.style.background='#EAF3DE';confirmBtn.style.color='#27500A';confirmBtn.style.borderColor='#3B6D11';
    confirmBtn.textContent='Duyệt hồ sơ';
  } else if(type==='reject'){
    icon.className='conf-icon conf-icon-reject';
    iconI.className='ti ti-x';
    title.textContent='Từ chối hồ sơ này?';
    sub.textContent='Hãy nhập lý do từ chối — thông tin này sẽ được gửi đến đối tác qua email.';
    commentWrap.style.display='block';
    document.getElementById('conf-textarea').placeholder='Nhập lý do từ chối (bắt buộc)...';
    confirmBtn.style.background='#FCEBEB';confirmBtn.style.color='#791F1F';confirmBtn.style.borderColor='#A32D2D';
    confirmBtn.textContent='Từ chối hồ sơ';
  } else {
    icon.className='conf-icon conf-icon-more';
    iconI.className='ti ti-mail';
    title.textContent='Yêu cầu bổ sung tài liệu?';
    sub.textContent='Nhập nội dung yêu cầu — đối tác sẽ nhận email và có thể nộp bổ sung.';
    commentWrap.style.display='block';
    document.getElementById('conf-textarea').placeholder='Ví dụ: Vui lòng bổ sung giấy phép PCCC...';
    confirmBtn.style.background='#FAEEDA';confirmBtn.style.color='#633806';confirmBtn.style.borderColor='#854F0B';
    confirmBtn.textContent='Gửi yêu cầu';
  }
  wrap.classList.add('show');
}

document.getElementById('conf-cancel').addEventListener('click',()=>document.getElementById('conf-wrap').classList.remove('show'));
document.getElementById('conf-wrap').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
document.getElementById('conf-confirm').addEventListener('click',()=>{
  const r=RECORDS[cur];
  if(confType==='approve')r.status='approved';
  else if(confType==='reject')r.status='rejected';
  else r.status='needmore';
  document.getElementById('conf-wrap').classList.remove('show');
  renderAll();
});

document.getElementById('btn-approve-main').addEventListener('click',()=>openConf('approve'));
document.getElementById('btn-reject-main').addEventListener('click',()=>openConf('reject'));
document.getElementById('btn-more-main').addEventListener('click',()=>openConf('more'));
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;renderAll();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<RECORDS.length-1){cur++;renderAll();}});

renderAll();
</script>

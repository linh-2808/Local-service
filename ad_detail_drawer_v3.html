      <button class="ibtn" aria-label="Kiểm tra URL"><i class="ti ti-refresh" aria-hidden="true"></i></button>

  <div class="two-col">
    <div class="card">
      <div class="sec-t">

        <span style="font-size:11.5px;color:${failCnt>0?'#A32D2D':'#3B6D11'}">${okCnt}/${r.checks.length} passed${failCnt>0?' · '+failCnt+' lỗi':''}</span>
      </div>
      <div class="check-list">
        ${r.checks.map((c,i)=>`
          <div class="ci ${c.s==='ok'?'ok':c.s==='fail'?'fail':''}" data-ci="${i}">
            <div class="ci-box ${c.s==='ok'?'ok':c.s==='fail'?'fail':''}"><i class="ti ti-${c.s==='ok'?'check':c.s==='fail'?'x':''}" aria-hidden="true" style="font-size:10px"></i></div>
            <span class="ci-label">${c.l}</span>
            <span class="ci-badge ${c.src==='auto'?'auto-badge':c.src==='ai'?'ai-badge':'manual-badge'}">${c.src==='auto'?'Auto':c.src==='ai'?'AI':'Manual'}</span>

          return`<div class="ver-item ${isCur?'current':''}">

            <div class="ver-info"><div class="ver-name">${v.label}</div><div class="ver-meta">${v.date} · ${v.note}</div></div>
            <span class="pill ${vs}" style="font-size:10px">${v.status==='approved'?'OK':v.status==='rejected'?'Reject':'Pending'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec-t">Lịch sử nhà quảng cáo — ${r.advertiser}</div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px">
      <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px"><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px">Số chiến dịch</div><div style="font-size:18px;font-weight:500;color:var(--color-text-primary)">${r.history.campaigns}</div></div>
      <div style="background:${parseInt(r.history.rejectRate)>15?'#FCEBEB':'var(--color-background-secondary)'};border-radius:var(--border-radius-md);padding:8px 10px"><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px">Tỷ lệ reject</div><div style="font-size:18px;font-weight:500;color:${parseInt(r.history.rejectRate)>15?'#791F1F':'var(--color-text-primary)'}">${r.history.rejectRate}</div></div>

      <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px"><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px">Lần reject gần nhất</div><div style="font-size:11.5px;font-weight:500;color:var(--color-text-primary)">${r.history.lastReject}</div></div>

      ${r.timeline.map(tl=>`

    </div>
  </div>

  <div class="card">
    <div class="sec-t">Ghi chú nội bộ</div>
    <textarea rows="3" placeholder="Nhập ghi chú admin, lý do quyết định..."></textarea>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:5px">Ghi chú lưu vào audit log, gửi nhà QC nếu yêu cầu sửa.</div>
  </div>`;

  document.getElementById('dev-tabs').addEventListener('click',e=>{
    const t=e.target.closest('[data-dev]');
    if(!t)return;
    devTab=t.dataset.dev;
    renderBody();
  });
  document.querySelectorAll('.ci[data-ci]').forEach(el=>el.addEventListener('click',function(){
    const ci=ADS[cur].checks[+this.dataset.ci];
    if(ci.src!=='manual')return;
    ci.s=ci.s==='ok'?'pending':'ok';
    renderBody();
  }));
}

  document.getElementById('top-badges').innerHTML=`<span class="pill ${sm.cls}">${sm.l}</span><span class="pill ${SLAM[r.sla].cls}">${r.slaH}h</span>`;

function openConf(type){
  confType=type;
  const r=ADS[cur];
  const icon=document.getElementById('cf-icon');
  const ii=document.getElementById('cf-icon-i');
  const tt=document.getElementById('cf-title');
  const sub=document.getElementById('cf-sub');
  const rw=document.getElementById('cf-reason');
  const ok=document.getElementById('cf-ok');
  const pr=document.getElementById('cf-presets');
  const failCnt=r.checks.filter(c=>c.s==='fail').length;
  const triggered=r.rules.filter(x=>x.state==='triggered').length;
  if(type==='approve'){
    icon.className='conf-icon-wrap cfa';ii.className='ti ti-check';
    tt.textContent='Duyệt quảng cáo này?';
    sub.textContent=failCnt+triggered>0?`Còn ${failCnt} lỗi checklist, ${triggered} rule triggered. Vẫn muốn duyệt?`:'Tất cả validation passed. Xác nhận duyệt.';
    rw.style.display='none';ok.style.cssText='background:#EAF3DE;color:#27500A;border-color:#3B6D11';ok.textContent='Duyệt';
  } else if(type==='reject'){
    icon.className='conf-icon-wrap cfr';ii.className='ti ti-x';
    tt.textContent='Từ chối quảng cáo?';sub.textContent='Chọn hoặc nhập lý do gửi nhà quảng cáo.';
    rw.style.display='block';pr.innerHTML=REASONS.reject.map(p=>`<span class="ptag">${p}</span>`).join('');
    ok.style.cssText='background:#FCEBEB;color:#791F1F;border-color:#A32D2D';ok.textContent='Từ chối';
  } else {
    icon.className='conf-icon-wrap cfm';ii.className='ti ti-send';
    tt.textContent='Yêu cầu sửa đổi?';sub.textContent='Nhà QC nhận email và có thể nộp lại phiên bản mới.';
    rw.style.display='block';pr.innerHTML=REASONS.more.map(p=>`<span class="ptag">${p}</span>`).join('');
    ok.style.cssText='background:#FAEEDA;color:#633806;border-color:#854F0B';ok.textContent='Gửi yêu cầu';
  }
  document.querySelectorAll('.ptag').forEach(t=>t.addEventListener('click',function(){
    this.classList.toggle('sel');
    document.getElementById('cf-ta').value=[...document.querySelectorAll('.ptag.sel')].map(x=>x.textContent).join('\n');
  }));
  document.getElementById('conf-overlay').classList.add('show');
}

document.getElementById('cf-cancel').addEventListener('click',()=>document.getElementById('conf-overlay').classList.remove('show'));
document.getElementById('conf-overlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
document.getElementById('cf-ok').addEventListener('click',()=>{
  if(confType==='approve')ADS[cur].status='approved';
  else if(confType==='reject')ADS[cur].status='rejected';
  else ADS[cur].status='changes';
  document.getElementById('conf-overlay').classList.remove('show');
  renderAll();
});
document.getElementById('drw-approve').addEventListener('click',()=>openConf('approve'));
document.getElementById('drw-reject').addEventListener('click',()=>openConf('reject'));
document.getElementById('drw-more').addEventListener('click',()=>openConf('more'));
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;renderAll();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<ADS.length-1){cur++;renderAll();}});

renderAll();
</script>
